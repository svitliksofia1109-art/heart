<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #040406;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Consolas', 'Courier New', monospace;
            cursor: pointer;
            user-select: none;
        }

        canvas {
            display: block;
        }

        #hint {
            position: absolute;
            bottom: 30px;
            color: rgba(255, 195, 150, 0.75);
            font-size: 13px;
            letter-spacing: 2px;
            pointer-events: none;
            transition: opacity 0.6s ease;
        }
    </style>
</head>
<body>
    <div id="hint">[ натисни, щоб відкрити лист ]</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const ENVELOPE_ART = [
            "//////////////////////////////////////////////////",
            "/\\                                              /\\",
            "/  \\                                          /  \\",
            "/    \\              @@@     @@@              /    \\",
            "/      \\           @@  @   @  @@           /      \\",
            "/        \\        @     @@@     @        /        \\",
            "/          \\      @             @      /          \\",
            "/            \\     @           @     /            \\",
            "/              \\     @       @     /              \\",
            "/                \\     @   @     /                \\",
            "/                  \\_____@_____/                  \\",
            "/                                                \\",
            "/    %%%   %%%%   %%%%%      %   %   %%%   %   %  \\",
            "/    %     %  %   %   %      %   %  %   %  %   %  \\",
            "/   %%%    %  %   %%%%%       % %   %   %  %   %  \\",
            "/    %     %  %   %  %         %    %   %  %   %  \\",
            "/    %     %%%%   %   %        %     %%%    %%%   \\",
            "/                                                \\",
            "//////////////////////////////////////////////////"
        ];

        const FLOWER_ART = [
            "                        ..::****::..                        ",
            "                    ..**@@@@@@@@@@@@**..                    ",
            "                 .**@@@@@@%%%%%%%%@@@@@@**.                 ",
            "               .*@@@@@%%%%@@@@@@@@%%%%@@@@@*.               ",
            "              .*@@@@%%%@@@@@@**@@@@@@%%%@@@@*.              ",
            "             .*@@@@%%@@@@@**####**@@@@@%%@@@@*.             ",
            "             *@@@@%%@@@@**########**@@@@%%@@@@*             ",
            "             *@@@@%%@@@**###@@@@###**@@@%%@@@@*             ",
            "             .*@@@@%%@@@**##@@@@##**@@@%%@@@@*.             ",
            "              .*@@@@%%@@@@**####**@@@@%%@@@@*.              ",
            "               .*@@@@@%%%@@@@@@@@%%%@@@@@*.                 ",
            "                ..*@@@@@@%%%%%%%%@@@@@@*..                  ",
            "                 ..**@@@@@@@@@@@@@@@@**..                   ",
            "                   ..***@@@@@@@@@@***..                     ",
            "                     ...***@@@@***...                       ",
            "                          ..||..                            ",
            "                            ||                              ",
            "                ..\\\\\\       ||       ///..                  ",
            "              .\\\\\\%%%\\\\\\    ||    ///%%%///.                ",
            "             .\\\\\\%%%%%\\\\\\   ||   ///%%%%%///.               ",
            "              ..\\\\\\%%%\\\\\\   ||   ///%%%///..                ",
            "                ...\\\\\\      ||      ///...                  ",
            "                            ||                              ",
            "                      ..\\\\  ||                              ",
            "                     .\\\\\\%\\\\||                              ",
            "                      ..\\\\\\ ||                              ",
            "                            ||                              ",
            "                            ||                              ",
            "                            ||                              "
        ];

        function getEnvelopeColor(ch) {
            if (ch === '@') return '#ff2a55';
            if (ch === '%') return '#ffd166';
            return '#e0a96d';
        }

        function getFlowerColor(ch, r) {
            if (r <= 14) {
                if (ch === '#') return '#ff0a54';
                if (ch === '@') return '#ff477e';
                if (ch === '%') return '#ff85a1';
                if (ch === '*') return '#fbb1bd';
                return '#ffe5ec';
            }
            if (ch === '%') return '#80ed99';
            if (ch === '\\' || ch === '/') return '#38b000';
            if (ch === '|') return '#2b9348';
            return '#c7f9cc';
        }

        let particles = [];
        let state = 'CLOSED';
        let timer = 0;

        function initParticles() {
            particles = [];
            const fontSize = Math.max(8, Math.min(14, Math.floor(width / 68)));
            const charW = fontSize * 0.6;
            const charH = fontSize * 1.15;

            const envStart = [];
            const envW = ENVELOPE_ART[0].length * charW;
            const envH = ENVELOPE_ART.length * charH;
            const envOffX = (width - envW) / 2;
            const envOffY = (height - envH) / 2 + 15;

            for (let r = 0; r < ENVELOPE_ART.length; r++) {
                for (let c = 0; c < ENVELOPE_ART[r].length; c++) {
                    const ch = ENVELOPE_ART[r][c];
                    if (ch !== ' ') {
                        envStart.push({
                            ch: ch,
                            color: getEnvelopeColor(ch),
                            x: envOffX + c * charW,
                            y: envOffY + r * charH,
                            row: r
                        });
                    }
                }
            }

            const flwEnd = [];
            const flwW = FLOWER_ART[0].length * charW;
            const flwH = FLOWER_ART.length * charH;
            const flwOffX = (width - flwW) / 2;
            const flwOffY = (height - flwH) / 2;

            for (let r = 0; r < FLOWER_ART.length; r++) {
                for (let c = 0; c < FLOWER_ART[r].length; c++) {
                    const ch = FLOWER_ART[r][c];
                    if (ch !== ' ') {
                        flwEnd.push({
                            ch: ch,
                            color: getFlowerColor(ch, r),
                            x: flwOffX + c * charW,
                            y: flwOffY + r * charH
                        });
                    }
                }
            }

            const count = Math.max(envStart.length, flwEnd.length);
            for (let i = 0; i < count; i++) {
                const s = envStart[i % envStart.length];
                const e = flwEnd[i % flwEnd.length];

                const spreadX = (Math.random() - 0.5) * 9;
                const upSpeed = -(Math.random() * 7 + 2.5);

                particles.push({
                    x: s.x,
                    y: s.y,
                    targetX: e.x,
                    targetY: e.y,
                    ch: s.ch,
                    color: s.color,
                    targetCh: e.ch,
                    targetColor: e.color,
                    vx: spreadX,
                    vy: upSpeed,
                    delay: s.row * 1.4,
                    fontSize: fontSize
                });
            }

            for (let i = 0; i < 85; i++) {
                const rx = Math.random() * width;
                const ry = Math.random() * height;
                particles.push({
                    x: rx,
                    y: ry,
                    ch: Math.random() > 0.4 ? '.' : '*',
                    color: 'rgba(255, 190, 160, 0.35)',
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    fontSize: fontSize,
                    isDust: true
                });
            }
        }

        initParticles();

        function openLetter() {
            if (state === 'CLOSED') {
                state = 'FOUNTAIN';
                hint.style.opacity = '0';
            }
        }

        window.addEventListener('click', openLetter);
        window.addEventListener('touchstart', openLetter);
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Enter' || e.code === 'Space') openLetter();
        });

        function animate() {
            ctx.fillStyle = 'rgba(4, 4, 6, 0.32)';
            ctx.fillRect(0, 0, width, height);

            if (state === 'FOUNTAIN') {
                timer++;
                if (timer > 50) {
                    state = 'FORMING';
                    for (let p of particles) {
                        if (!p.isDust) {
                            p.ch = p.targetCh;
                            p.color = p.targetColor;
                        }
                    }
                }
            }

            for (let p of particles) {
                if (p.isDust) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0) p.x = width;
                    if (p.x > width) p.x = 0;
                    if (p.y < 0) p.y = height;
                    if (p.y > height) p.y = 0;
                } else if (state === 'FOUNTAIN') {
                    if (timer > p.delay) {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.12;
                        p.vx *= 0.96;
                    }
                } else if (state === 'FORMING') {
                    p.x += (p.targetX - p.x) * 0.065;
                    p.y += (p.targetY - p.y) * 0.065;
                }

                ctx.font = `bold ${p.fontSize}px Consolas, monospace`;
                ctx.fillStyle = p.color;
                ctx.fillText(p.ch, p.x, p.y);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
